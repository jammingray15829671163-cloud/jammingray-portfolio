async function createDraftZip(snapshot,assets,includeVideos=true,onProgress=()=>{},signal) {
  const files={},omittedVideos=[],entries=[];
  for(const [key,file] of Object.entries(assets)) {
    if(!includeVideos&&key.endsWith(':video')) {omittedVideos.push({key,name:file.name||'video',size:file.size});continue;}
    const type=file.type||(key.endsWith(':video')?'video/mp4':'image/jpeg');
    const extensions={'image/jpeg':'jpg','image/png':'png','image/webp':'webp','image/gif':'gif','image/svg+xml':'svg','image/avif':'avif','video/mp4':'mp4','video/webm':'webm'};
    const path='media/'+String(entries.length+1).padStart(5,'0')+'.'+(extensions[type]||'bin');
    files[key]={path,name:file.name||path,type,size:file.size};
    entries.push({path,name:file.name,data:file});
  }
  const manifest={format:'film-sound-portfolio',version:3,model:snapshot,files,omittedVideos};
  entries.unshift({path:'manifest.json',data:new Blob([JSON.stringify(manifest)],{type:'application/json'})});
  return {blob:await makeStoredZip(entries,onProgress,signal),omittedVideos};

function checkedNumber(value) {const n=Number(value);if(!Number.isSafeInteger(n)||n<0)throw new Error('草稿文件大小或偏移无效。');return n;}
async function zipSlice(file,start,size) {
  if(!Number.isSafeInteger(start)||!Number.isSafeInteger(size)||start<0||size<0||start+size>file.size)throw new Error('草稿包不完整，请重新导出。');
  return file.slice(start,start+size);
}
async function storedZipIndex(file) {
  const tailStart=Math.max(0,file.size-65557),tail=new DataView(await file.slice(tailStart).arrayBuffer());
  let end=-1;
  for(let i=tail.byteLength-22;i>=0;i--)if(tail.getUint32(i,true)===0x06054b50&&i+22+tail.getUint16(i+20,true)===tail.byteLength){end=i;break;}
  if(end<0||tail.getUint16(end+4,true)||tail.getUint16(end+6,true))throw new Error('不是本站导出的草稿 ZIP。');

  if(count===65535||size===zip32Limit||offset===zip32Limit) {

    if(loc.getUint32(0,true)!==0x07064b50||loc.getUint32(4,true)!==0||loc.getUint32(16,true)!==1)throw new Error('草稿 ZIP64 索引无效。');
    const rec=new DataView(await (await zipSlice(file,checkedNumber(loc.getBigUint64(8,true)),56)).arrayBuffer());
    if(rec.getUint32(0,true)!==0x06064b50||rec.getUint32(16,true)||rec.getUint32(20,true))throw new Error('草稿 ZIP64 索引无效。');

    const flags=v.getUint16(at+8,true),method=v.getUint16(at+10,true),crc=v.getUint32(at+16,true);
    let packed=v.getUint32(at+20,true),length=v.getUint32(at+24,true),local=v.getUint32(at+42,true);

    const path=backupDecoder.decode(central.subarray(at+46,at+46+nameSize));
    if(!/^(manifest\.json|media\/[0-9]+\.[a-z0-9]+)$/.test(path)||items.has(path))throw new Error('草稿包文件名无效。');

async function decodeZipBackup(file,onProgress=()=>{}) {
  const index=await storedZipIndex(file),entry=index.get('manifest.json');

  if(await blobCrc32(entry.data)!==entry.crc)throw new Error('草稿内容清单损坏。');
  const manifest=JSON.parse(await entry.data.text());
  if(manifest.format!=='film-sound-portfolio'||manifest.version!==3)throw new Error('不支持的草稿版本。');
  const next=cleanModel(manifest.model),allowed=validMediaKeys(next),media={};
  const entries=Object.entries(manifest.files||{});let done=0;
  for(const [key,meta] of entries) {

    if(!allowed.has(key)||!item||typeof meta.type!=='string'||!meta.type.startsWith(kind+'/')||item.data.size!==meta.size)throw new Error('草稿素材清单无效。');
    if(await blobCrc32(item.data)!==item.crc)throw new Error('素材「'+meta.name+'」损坏，请重新导出。');

  }
  const omittedVideos=(manifest.omittedVideos||[]).filter(item=>allowed.has(item.key)&&item.key.endsWith(':video'));

}

let backupDownloadUrl;
function downloadArchive(blob,name) {
  if(backupDownloadUrl)URL.revokeObjectURL(backupDownloadUrl);
  backupDownloadUrl=URL.createObjectURL(blob);
  const link=document.querySelector('#backup-download');
  link.href=backupDownloadUrl;link.download=name;link.hidden=false;
  link.textContent='下载已生成的 '+(name.includes('Publishing')?'上线资料 ZIP':'完整草稿 ZIP');
  link.click();
}
let exportController;
document.querySelector('#cancel-export').addEventListener('click',()=>exportController?.abort());
async function exportDraft(includeVideos) {
  if(busy)return;
  if(dirty){statusLine.textContent='请先保存这一栏的修改，再导出草稿。';return;}
  busy=true;
  exportController=new AbortController();
  const cancel=document.querySelector('#cancel-export');cancel.hidden=false;
  const buttons=[document.querySelector('#export-draft'),document.querySelector('#export-publish')];
  buttons.forEach(button=>button.disabled=true);
  const filename=includeVideos?'Jiaming_Lei_Portfolio_Draft.zip':'Jiaming_Lei_Portfolio_Publishing.zip';
  let writer;
  try {
    // Invoke the native save picker while the original click still has user activation.
    const handle=window.isSecureContext&&typeof window.showSaveFilePicker==='function'?
      await window.showSaveFilePicker({suggestedName:filename,types:[{description:'作品集草稿 ZIP',accept:{'application/zip':['.zip']}}]}):null;
    await ready;
    const snapshot=structuredClone(model),assets={...blobs};
    statusLine.textContent='正在导出 '+snapshot.projects.length+' 个项目…';
    const result=await createDraftZip(snapshot,assets,includeVideos,progress=>{
      const percent=progress.total?Math.floor(progress.read/progress.total*100):100;
      statusLine.textContent='正在打包 '+percent+'% · '+(progress.read/1048576).toFixed(1)+' / '+(progress.total/1048576).toFixed(1)+' MB · '+progress.file;
    },exportController.signal);
    abortBackup(exportController.signal);
    if(handle) {
      writer=await handle.createWritable();
      const reader=result.blob.stream().getReader();let written=0;
      try {while(true){abortBackup(exportController.signal);const {done,value}=await reader.read();if(done)break;await writer.write(value);written+=value.length;statusLine.textContent='正在保存 ZIP · '+Math.floor(written/result.blob.size*100)+'%';}}
      finally{await reader.cancel().catch(()=>{});reader.releaseLock();}
      await writer.close();writer=null;
    } else downloadArchive(result.blob,filename);
    statusLine.textContent=includeVideos?'完整草稿 ZIP 已生成，包含文案、图片和本地视频。如未开始下载，请点击下方下载链接。':
      '上线资料 ZIP 已生成，包含文案、图片和视频链接；未包含 '+result.omittedVideos.length+' 个本地视频，原浏览器中的视频仍保留。如未开始下载，请点击下方下载链接。';
  } catch(error) {
    if(writer)await writer.abort().catch(()=>{});
    statusLine.textContent=error.name==='AbortError'?'已取消导出，原有草稿未改变。':
      '导出未完成：'+(error.message||'请尝试「导出上线资料（不含本地视频）」。');

document.querySelector('#export-draft').addEventListener('click',()=>exportDraft(true));
document.querySelector('#export-publish').addEventListener('click',()=>exportDraft(false));
window.addEventListener('beforeunload',event=>{if(busy){event.preventDefault();event.returnValue='';}});

async function decodeBackup(payload) {
  if (!payload || typeof payload !== 'object') throw new Error('invalid backup');
  if (payload.format !== 'film-sound-portfolio') {
    if (!['name','title','tagline','heroUrl','posterUrl'].some(key => typeof payload[key] === 'string')) throw new Error('invalid legacy backup');
    return {next:legacyModel(payload),media:{}};
  }
  if (payload.version !== 2) throw new Error('unsupported version');
  const next = cleanModel(payload.model);
  const allowed = validMediaKeys(next);
  const media = {};
  for (const [key,file] of Object.entries(payload.media || {})) {
    const kind = key.endsWith(':video') ? 'video' : 'image';
    if (!allowed.has(key) || typeof file?.data !== 'string' || !new RegExp('^data:' + kind + '/[a-z0-9.+-]+;base64,','i').test(file.data)) throw new Error('invalid media');
    const blob = await (await fetch(file.data)).blob();
    media[key] = new File([blob],String(file.name || 'media'),{type:blob.type});
  }
  return {next,media};
}
document.querySelector('#import-draft').addEventListener('change',async event => {
  const file = event.target.files[0];
  event.target.value = '';
  if (!file || busy || !window.confirm('载入草稿会替换当前预览的栏目内容和本地素材。继续载入？')) return;
  busy = true;
  statusLine.textContent = '正在载入草稿…';
  try {
    const signature=new DataView(await file.slice(0,4).arrayBuffer());
    const imported=signature.byteLength===4&&signature.getUint32(0,true)===0x04034b50?

      await decodeBackup(JSON.parse(await file.text()));
    let retained=0;
    for(const entry of imported.omittedVideos||[])if(blobs[entry.key]){imported.media[entry.key]=blobs[entry.key];retained++;}
    model = imported.next;
    swapMedia(imported.media);
    selected = '';
    const message = await updatePreview();
    fillEditor();
    statusLine.textContent = '草稿已载入。' + message + ((imported.omittedVideos||[]).length?' 这是不含本地视频的上线资料包；已保留本浏览器原有的 '+retained+' 个视频。':'');
  } catch(error) {statusLine.textContent = '无法载入：'+(error.message||'请选择本站导出的 ZIP 或旧版 JSON 草稿。');}
  finally {busy = false;}
});
